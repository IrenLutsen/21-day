document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  \u002F* Elevation – derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. *\u002F\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:contrast(1.08)}\n\n\u002F* ══════════════════════════════════════════════════════════════════════════\n   Components – built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations\u002F and components\u002F.\n   ══════════════════════════════════════════════════════════════════════ *\u002F\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var( { box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n  a { color: var(--color-accent-700); }\n  a:hover { color: var(--color-accent); }\n  img { display: block; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"font-size: 17px; line-height: 1.6;\">\n\n  <header style=\"position: sticky; top: 0; z-index: 50; background: var(--color-bg); border-bottom: 2px solid var(--color-text);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px;\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.3;\">Кар'єрна програма для жінок 35+<br><span style=\"color: var(--color-neutral-700);\">від Ірини Луценко<\u002Fspan><\u002Fdiv>\n      <a class=\"btn btn-primary\" href=\"{{ payLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ onPayClick }}\" style=\"flex: none;\">Оплатити участь – {{ priceLabel }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"max-width: 1180px; margin: 0 auto; padding: 56px 24px 48px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 48px; align-items: start;\">\n      <div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px;\">\n          <span class=\"tag tag-accent\">Старт 1 жовтня<\u002Fspan>\n          <span class=\"tag tag-outline\">Новий потік · 21 день<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 16px;\">«Видима і впевнена»<\u002Fdiv>\n        <h1 style=\"font-family: var(--font-heading); font-size: clamp(40px, 6vw, 76px); font-weight: 800; line-height: 0.98; letter-spacing: -0.03em; margin: 0 0 20px; text-wrap: pretty;\">Від резюме до запрошення на співбесіду – за 21 день<\u002Fh1>\n        <p style=\"font-size: clamp(18px, 1.8vw, 21px); line-height: 1.5; margin: 0 0 28px; max-width: 34em; color: var(--color-neutral-800);\">21-денний челендж для жінок 35+, які хочуть знайти роботу, правильно презентувати свій досвід і побудувати стратегію пошуку роботи на 6 місяців.<\u002Fp>\n        <div style=\"border-top: 2px solid var(--color-text); display: grid;\">\n          <div style=\"display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-neutral-300);\">\n            <span style=\"font-weight: 800; color: var(--color-accent);\">01<\u002Fspan>\n            <span>Чітка стратегія пошуку роботи на 6 місяців – знаєш, де шукати, як діяти та що робити вже з першого дня.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-neutral-300);\">\n            <span style=\"font-weight: 800; color: var(--color-accent);\">02<\u002Fspan>\n            <span>Підготовка до співбесіди без паніки – готові відповіді на складні запитання та впевнена презентація свого досвіду.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 2px solid var(--color-text);\">\n            <span style=\"font-weight: 800; color: var(--color-accent);\">03<\u002Fspan>\n            <span>Резюме та LinkedIn, які працюють на тебе – навіть якщо ти мала тривалу кар'єрну паузу.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 28px; max-width: 340px;\">\n          <div style=\"border: 2px solid var(--color-text); border-bottom: none; background: var(--color-accent-200); padding: 10px 14px; font-variant-numeric: tabular-nums;\">\n            <div style=\"font-size: 14px; font-weight: 800; color: var(--color-accent-800);\">{{ badgeLine1 }}<\u002Fdiv>\n            <div style=\"font-size: 12px; font-weight: 600; color: var(--color-accent-800);\">{{ badgeLine2 }}<\u002Fdiv>\n          <\u002Fdiv>\n          <a class=\"btn btn-primary btn-block\" href=\"{{ payLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ onPayClick }}\">Оплатити участь – {{ priceLabel }}<\u002Fa>\n          <p style=\"font-size: 14px; color: var(--color-neutral-700); margin: 10px 0 0;\">Ціна €39 діє до 30.09, далі – €79<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grayscale\">\n        <img src=\"181186d2-8663-4ab8-a022-2c9a500d6e79\" alt=\"Ірина Луценко, кар'єрна коучка\" style=\"width: 100%; height: auto;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"hr\" style=\"max-width: 1180px; margin: 0 auto;\">\n\n  <section id=\"whatyouget\" style=\"max-width: 1180px; margin: 0 auto; padding: 56px 24px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 40px;\">\n      <div>\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px;\">Що ти отримаєш<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-heading); font-size: clamp(30px, 3.6vw, 46px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 18px;\">Що ти забираєш після 21 дня<\u002Fh2>\n        <p style=\"color: var(--color-neutral-800); margin: 0;\">21 день – це час від рішення почати до першої реальної співбесіди. Не теорія, а щоденна практика.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text);\">\n        <div style=\"background: var(--color-accent-200); border-bottom: 1px solid var(--color-neutral-300); padding: 18px 20px;\">\n          <b style=\"display: block; font-weight: 800; font-size: 19px; margin-bottom: 4px;\">Стратегію пошуку роботи на 6 місяців<\u002Fb>\n          <span style=\"color: var(--color-accent-800);\">Не просто красивий документ у папці, а конкретний план: як подавати себе, де шукати, як презентувати на співбесідах – і що робити щотижня.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 18px 20px 18px 0;\">\n          <b style=\"display: block; font-weight: 800; font-size: 19px; margin-bottom: 4px;\">Готову розповідь про себе<\u002Fb>\n          <span style=\"color: var(--color-neutral-800);\">Elevator pitch для знайомств і розгорнута версія для HR – готові, відрепетирувані, твої.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 18px 20px 18px 0;\">\n          <b style=\"display: block; font-weight: 800; font-size: 19px; margin-bottom: 4px;\">Резюме через результати<\u002Fb>\n          <span style=\"color: var(--color-neutral-800);\">Рекрутер бачить цінність з першого рядка.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 18px 20px 18px 0;\">\n          <b style=\"display: block; font-weight: 800; font-size: 19px; margin-bottom: 4px;\">LinkedIn-профіль, який знаходять рекрутери<\u002Fb>\n          <span style=\"color: var(--color-neutral-800);\">З'являється в пошуку – навіть якщо ти не подавалась на вакансію. Плюс 5–8 дописів, вже опублікованих.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-bottom: 2px solid var(--color-text); padding: 18px 20px 18px 0;\">\n          <b style=\"display: block; font-weight: 800; font-size: 19px; margin-bottom: 4px;\">Підготовка до співбесіди<\u002Fb>\n          <span style=\"color: var(--color-neutral-800);\">Індивідуальні скрипти – як відповідати на «розкажіть про ваші досягнення», «чому перерва в кар'єрі», «чому саме ви» – виходячи з твого реального досвіду.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 32px; margin-top: 48px; border-top: 2px solid var(--color-text); padding-top: 28px;\">\n      <div>\n        <h4 style=\"font-family: var(--font-heading); font-size: 20px; font-weight: 800; line-height: 1.15; margin: 0 0 6px;\">Як шукати роботу<\u002Fh4>\n        <p style=\"color: var(--color-neutral-800); margin: 0;\">Не розсилати резюме навмання, а розуміти, де і як тебе знаходять.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"font-family: var(--font-heading); font-size: 20px; font-weight: 800; line-height: 1.15; margin: 0 0 6px;\">Як проходити співбесіду на релаксі<\u002Fh4>\n        <p style=\"color: var(--color-neutral-800); margin: 0;\">Скрипти відповідей на незручні питання – про вік, паузу в кар'єрі, досвід.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"font-family: var(--font-heading); font-size: 20px; font-weight: 800; line-height: 1.15; margin: 0 0 6px;\">Як нетворкатись<\u002Fh4>\n        <p style=\"color: var(--color-neutral-800); margin: 0;\">Як знайомитись і розповідати про себе так, щоб це не було схоже на продаж.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"font-family: var(--font-heading); font-size: 20px; font-weight: 800; line-height: 1.15; margin: 0 0 6px;\">І спільнота жінок, які підтримують одна одну<\u002Fh4>\n        <p style=\"color: var(--color-neutral-800); margin: 0;\">Не наодинці зі своїми сумнівами – а серед тих, хто проходить те саме прямо зараз.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    \n\n    <div style=\"margin-top: 32px;\">\n      <a class=\"btn btn-primary\" href=\"{{ payLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ onPayClick }}\">Оплатити участь – {{ priceLabel }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"hr\" style=\"max-width: 1180px; margin: 0 auto;\">\n\n  <section id=\"for\" style=\"max-width: 1180px; margin: 0 auto; padding: 56px 24px;\">\n    <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px;\">Для кого<\u002Fdiv>\n    <h2 style=\"font-family: var(--font-heading); font-size: clamp(30px, 3.6vw, 46px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 32px;\">Для кого ця програма<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); border-top: 2px solid var(--color-text);\">\n      <div style=\"padding: 24px 32px 24px 0;\">\n        <h3 style=\"font-family: var(--font-heading); font-size: 24px; font-weight: 800; margin: 0 0 16px;\">Це для тебе<\u002Fh3>\n        <div style=\"display: grid;\">\n          <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 12px 0; color: var(--color-neutral-800);\">Бачиш молодших кандидаток і думаєш: «мабуть, я вже не та».<\u002Fdiv>\n          <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 12px 0; color: var(--color-neutral-800);\">Була пауза в кар'єрі – декрет чи переїзд – і тепер не знаєш, як пояснити її на співбесіді.<\u002Fdiv>\n          <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 12px 0; color: var(--color-neutral-800);\">Надсилаєш резюме – і тиша. Хоча досвід є і він справжній.<\u002Fdiv>\n          <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 12px 0; color: var(--color-neutral-800);\">LinkedIn є, але рекрутери не пишуть. Профіль є – а запитів немає.<\u002Fdiv>\n          <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 12px 0; color: var(--color-neutral-800);\">Чула «просто повір у себе» – і це не допомогло знайти роботу.<\u002Fdiv>\n          <div style=\"padding: 12px 0; color: var(--color-neutral-800);\">Хочеш конкретний план на кожен день, а не ще одну мотиваційну лекцію.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 24px 0 24px 32px; border-left: 2px solid var(--color-text);\">\n        <h3 style=\"font-family: var(--font-heading); font-size: 24px; font-weight: 800; margin: 0 0 16px;\">Це не для тебе, якщо<\u002Fh3>\n        <div style=\"display: grid; gap: 12px; color: var(--color-neutral-800);\">\n          <div>Ти шукаєш чарівну кнопку, а не готова робити один маленький крок щодня.<\u002Fdiv>\n          <div>Ти не готова приділяти 15–30 хвилин на день протягом 21 дня.<\u002Fdiv>\n          <div>Ти хочеш, щоб хтось зробив усе за тебе – без твоєї участі й дій.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family: var(--font-heading); font-size: clamp(22px, 2.6vw, 32px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin: 32px 0 0; max-width: 24em;\">Кар'єра після 35 – це не пізно. Це досвід, який нарешті працює на тебе.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"urgency\" style=\"background: var(--color-accent); color: #fff;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 64px 24px;\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 18px;\">Навіщо саме зараз<\u002Fdiv>\n      <h2 style=\"font-family: var(--font-heading); font-size: clamp(34px, 5vw, 64px); font-weight: 800; line-height: 0.99; letter-spacing: -0.03em; margin: 0 0 24px; max-width: 22em;\">Місяць очікування нічого не змінить сам по собі<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 28px; border-top: 2px solid #fff; padding-top: 22px; font-size: 18px;\">\n        <p style=\"margin: 0;\">Зміни починаються не з часу, а з рішення почати.<\u002Fp>\n        <p style=\"margin: 0; font-weight: 800;\">Ціна €39 діє лише до 30 вересня, далі – €79.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"whatisit\" style=\"max-width: 1180px; margin: 0 auto; padding: 56px 24px;\">\n    <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px;\">Що це таке<\u002Fdiv>\n    <h2 style=\"font-family: var(--font-heading); font-size: clamp(30px, 3.6vw, 46px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 14px;\">Формат, який дає результат<\u002Fh2>\n    <p style=\"color: var(--color-neutral-800); max-width: 40em; margin: 0 0 32px;\">Щодня – одне завдання, один крок. Без довгих лекцій – з групою, яка не дає здатися.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); border-top: 2px solid var(--color-text); border-bottom: 2px solid var(--color-text);\">\n      <div style=\"padding: 24px 24px 24px 0;\">\n        <div style=\"color: var(--color-neutral-600); text-decoration: line-through; margin-bottom: 8px;\">Довга теорія<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: 24px; font-weight: 800; line-height: 1.1;\">Один крок щодня<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 24px; border-left: 2px solid var(--color-text);\">\n        <div style=\"color: var(--color-neutral-600); text-decoration: line-through; margin-bottom: 8px;\">Промови про мотивацію<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: 24px; font-weight: 800; line-height: 1.1;\">Конкретне завдання<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 24px; border-left: 2px solid var(--color-text);\">\n        <div style=\"color: var(--color-neutral-600); text-decoration: line-through; margin-bottom: 8px;\">Курс на самоті<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: 24px; font-weight: 800; line-height: 1.1;\">Група, що йде разом<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"program\" style=\"max-width: 1180px; margin: 0 auto; padding: 8px 24px 56px;\">\n    <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px;\">Програма<\u002Fdiv>\n    <h2 style=\"font-family: var(--font-heading); font-size: clamp(30px, 3.6vw, 46px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 14px;\">Три тижні, три опори<\u002Fh2>\n    <p style=\"color: var(--color-neutral-800); max-width: 44em; margin: 0 0 10px;\">Щодня – завдання в групі. Раз на тиждень – жива зустріч зі мною, 60 хв: ти, я і твої питання, не запис.<\u002Fp>\n    <p style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 32px;\">Самопрезентація → Резюме → Стратегія<\u002Fp>\n\n    <div style=\"border-top: 2px solid var(--color-text);\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 32px; padding: 28px 0; border-bottom: 1px solid var(--color-neutral-300);\">\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 44px; font-weight: 800; line-height: 1; color: var(--color-accent); letter-spacing: -0.03em;\">01<\u002Fdiv>\n          <h3 style=\"font-family: var(--font-heading); font-size: 26px; font-weight: 800; line-height: 1.1; margin: 10px 0 0;\">Вчимося говорити про себе<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 10px; color: var(--color-neutral-800);\">\n          <div>Чітка розповідь про себе, яку легко і впевнено сказати на співбесіді<\u002Fdiv>\n          <div>Кар'єрна пауза – переосмислена як сила, а не пояснення<\u002Fdiv>\n          <div>Сильні сторони – сформульовані простими словами, які запам'ятовують<\u002Fdiv>\n          <div style=\"color: var(--color-text);\"><b style=\"font-weight: 800;\">Жива зустріч<\u002Fb> – знайомство, розбір твоєї ситуації, перші кроки стратегії пошуку роботи<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 32px; padding: 28px 0; border-bottom: 1px solid var(--color-neutral-300);\">\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 44px; font-weight: 800; line-height: 1; color: var(--color-accent); letter-spacing: -0.03em;\">02<\u002Fdiv>\n          <h3 style=\"font-family: var(--font-heading); font-size: 26px; font-weight: 800; line-height: 1.1; margin: 10px 0 0;\">Вчимося писати резюме, яке працює<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 10px; color: var(--color-neutral-800);\">\n          <div>LinkedIn-профіль, який видно в пошуку і який цікавить рекрутерів<\u002Fdiv>\n          <div>Резюме, де твій досвід описаний через результати – не список обов'язків<\u002Fdiv>\n          <div>Заголовок і опис, які проходять автоматичну перевірку і виділяють тебе серед інших<\u002Fdiv>\n          <div style=\"color: var(--color-text);\"><b style=\"font-weight: 800;\">Жива зустріч<\u002Fb> – розбір LinkedIn і резюме наживо, твої питання<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 32px; padding: 28px 0; border-bottom: 2px solid var(--color-text);\">\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 44px; font-weight: 800; line-height: 1; color: var(--color-accent); letter-spacing: -0.03em;\">03<\u002Fdiv>\n          <h3 style=\"font-family: var(--font-heading); font-size: 26px; font-weight: 800; line-height: 1.1; margin: 10px 0 0;\">Пишемо стратегію пошуку на 6 місяців<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 10px; color: var(--color-neutral-800);\">\n          <div>Готові, відточені відповіді на незручні питання про вік і паузу – без виправдань<\u002Fdiv>\n          <div>Вміння говорити про себе на заходах природно, без відчуття «продажу»<\u002Fdiv>\n          <div>Завершена, цілісна історія про себе – яку ти готова розказати будь-де<\u002Fdiv>\n          <div style=\"color: var(--color-text);\"><b style=\"font-weight: 800;\">Жива зустріч<\u002Fb> – практика відповідей, підсумки й чіткий наступний крок<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 2px; margin-top: 40px; background: var(--color-text);\">\n      <div style=\"background: var(--color-surface); padding: 20px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 8px;\">Формат<\u002Fdiv>\n        <b style=\"display: block; font-weight: 800; font-size: 19px;\">Живі зустрічі зі мною<\u002Fb>\n        <span style=\"color: var(--color-neutral-800);\">Наживо, не запис<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-surface); padding: 20px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 8px;\">Формат<\u002Fdiv>\n        <b style=\"display: block; font-weight: 800; font-size: 19px;\">Спільнота<\u002Fb>\n        <span style=\"color: var(--color-neutral-800);\">Група, яка йде разом усі 21 день<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-surface); padding: 20px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 8px;\">Формат<\u002Fdiv>\n        <b style=\"display: block; font-weight: 800; font-size: 19px;\">Щоденна практика<\u002Fb>\n        <span style=\"color: var(--color-neutral-800);\">15–30 хв на день, коротко й по суті<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"hr\" style=\"max-width: 1180px; margin: 0 auto;\">\n\n  <section id=\"bonuses\" style=\"max-width: 1180px; margin: 0 auto; padding: 56px 24px;\">\n    <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px;\">Бонуси<\u002Fdiv>\n    <h2 style=\"font-family: var(--font-heading); font-size: clamp(30px, 3.6vw, 46px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 32px;\">А ще – бонуси, щоб нічого не гальмувало<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 2px; background: var(--color-text);\">\n      <div style=\"background: var(--color-bg); padding: 24px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 10px;\">Бонус 01<\u002Fdiv>\n        <h4 style=\"font-family: var(--font-heading); font-size: 22px; font-weight: 800; line-height: 1.12; margin: 0 0 4px;\">Стратегія пошуку роботи на 6 місяців<\u002Fh4>\n        <p style=\"font-style: italic; color: var(--color-neutral-800); margin: 0 0 12px;\">Розписана по тижнях<\u002Fp>\n        <p style=\"color: var(--color-neutral-800); margin: 0 0 14px;\">Не загальні поради, а конкретний план: де шукати, кому й коли писати, як подавати себе на кожному етапі – і готове резюме, адаптоване під різні типи вакансій, а не одна версія на все.<\u002Fp>\n        <div style=\"border-top: 1px solid var(--color-neutral-300); padding-top: 12px; font-size: 15px; color: var(--color-neutral-800);\">Знімає: «Знову буду діяти навмання»<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-bg); padding: 24px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 10px;\">Бонус 02<\u002Fdiv>\n        <h4 style=\"font-family: var(--font-heading); font-size: 22px; font-weight: 800; line-height: 1.12; margin: 0 0 4px;\">Бібліотека готових формулювань<\u002Fh4>\n        <p style=\"font-style: italic; color: var(--color-neutral-800); margin: 0 0 12px;\">Про вік і паузу в кар'єрі<\u002Fp>\n        <p style=\"color: var(--color-neutral-800); margin: 0 0 14px;\">Не треба вигадувати з нуля, як пояснити свій досвід або перерву. Готові фрази – для резюме, LinkedIn і живої розмови. Бери, адаптуй під себе.<\u002Fp>\n        <div style=\"border-top: 1px solid var(--color-neutral-300); padding-top: 12px; font-size: 15px; color: var(--color-neutral-800);\">Знімає: «Не знаю, як це сформулювати – немає часу і сил вигадувати»<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-bg); padding: 24px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 10px;\">Бонус 03<\u002Fdiv>\n        <h4 style=\"font-family: var(--font-heading); font-size: 22px; font-weight: 800; line-height: 1.12; margin: 0 0 4px;\">Твій особистий простір у Notion<\u002Fh4>\n        <p style=\"font-style: italic; color: var(--color-neutral-800); margin: 0 0 12px;\">Тут проходить уся робота<\u002Fp>\n        <p style=\"color: var(--color-neutral-800); margin: 0 0 14px;\">Записи всіх зустрічей, готові резюме, завдання й нотатки – усе в одному місці, назавжди. Telegram-група – для щоденних завдань і зв'язку з групою; особистий Notion – твій робочий простір із записами й прогресом.<\u002Fp>\n        <div style=\"border-top: 1px solid var(--color-neutral-300); padding-top: 12px; font-size: 15px; color: var(--color-neutral-800);\">Знімає: «А якщо я випаду на кілька днів»<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-bg); padding: 24px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 10px;\">Бонус 04<\u002Fdiv>\n        <h4 style=\"font-family: var(--font-heading); font-size: 22px; font-weight: 800; line-height: 1.12; margin: 0 0 4px;\">Навчишся працювати з AI<\u002Fh4>\n        <p style=\"font-style: italic; color: var(--color-neutral-800); margin: 0 0 12px;\">Швидше, а не замість себе<\u002Fp>\n        <p style=\"color: var(--color-neutral-800); margin: 0 0 14px;\">Як використовувати AI, щоб швидше адаптувати резюме під вакансію, готувати супровідні листи й тренувати відповіді на співбесіді – без відчуття, що технології тебе випереджають.<\u002Fp>\n        <div style=\"border-top: 1px solid var(--color-neutral-300); padding-top: 12px; font-size: 15px; color: var(--color-neutral-800);\">Знімає: «AI все одно мене замінить»<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"hr\" style=\"max-width: 1180px; margin: 0 auto;\">\n\n  <section id=\"price\" style=\"max-width: 1180px; margin: 0 auto; padding: 56px 24px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 48px;\">\n      <div>\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px;\">Ціна<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-heading); font-size: clamp(30px, 3.6vw, 46px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 14px;\">Early bird – обмежено в часі<\u002Fh2>\n        <p style=\"color: var(--color-neutral-800); margin: 0 0 24px;\">Без прихованих платежів. Старт 1 жовтня. Оплата підтверджує вашу участь.<\u002Fp>\n        <div style=\"border-top: 2px solid var(--color-text);\">\n          <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 14px 0; color: var(--color-neutral-800);\">21 день щоденних завдань + живі зустрічі зі мною по 60 хв<\u002Fdiv>\n          <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 14px 0; color: var(--color-neutral-800);\">Конкретна стратегія пошуку роботи на 6 місяців<\u002Fdiv>\n          <div style=\"border-bottom: 1px solid var(--color-neutral-300); padding: 14px 0; color: var(--color-neutral-800);\">Чотири бонуси вище – формулювання, записи зустрічей, Notion, AI<\u002Fdiv>\n          <div style=\"border-bottom: 2px solid var(--color-text); padding: 14px 0; font-weight: 800;\">Гарантія повернення коштів протягом перших 3 днів після старту<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 2px solid var(--color-text); padding: 28px; align-self: start;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700);\">{{ priceTag }}<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: clamp(56px, 8vw, 96px); font-weight: 800; line-height: 1; letter-spacing: -0.04em; margin: 8px 0 4px;\">{{ priceLabel }}<\u002Fdiv>\n        <div style=\"color: var(--color-neutral-800); margin-bottom: 24px;\">одна оплата, без підписки<\u002Fdiv>\n        <div style=\"border: 2px solid var(--color-text); border-bottom: none; background: var(--color-accent-200); padding: 10px 14px; font-variant-numeric: tabular-nums;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: var(--color-accent-800);\">{{ badgeLine1 }}<\u002Fdiv>\n          <div style=\"font-size: 12px; font-weight: 600; color: var(--color-accent-800);\">{{ badgeLine2 }}<\u002Fdiv>\n        <\u002Fdiv>\n        <a class=\"btn btn-primary btn-block\" href=\"{{ payLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ onPayClick }}\">Оплатити {{ priceLabel }}<\u002Fa>\n        <p style=\"font-size: 14px; color: var(--color-neutral-700); margin: 12px 0 0;\">Ціна €39 діє до 30.09, далі – €79. Оплата карткою через WayForPay.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"background: var(--color-text); color: var(--color-bg);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 64px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 48px; align-items: start;\">\n      <div class=\"grayscale\">\n        <img src=\"1afde879-cf4e-4464-ae8e-ace99eb9a156\" alt=\"Ірина Луценко, кар'єрна коучка\" style=\"width: 100%; height: auto;\">\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-400); margin-bottom: 14px;\">Про мене<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-heading); font-size: clamp(30px, 3.6vw, 48px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 20px;\">Справа не в тобі<\u002Fh2>\n        <div style=\"display: grid; gap: 14px; font-size: 17px; color: var(--color-neutral-300);\">\n          <p style=\"margin: 0;\"><b style=\"font-weight: 800; color: var(--color-bg);\">Я Ірина<\u002Fb> – мама, дружина. Більше 20 років працюю з людьми в різних сферах.<\u002Fp>\n          <p style=\"margin: 0;\">Я знаю, як це – відчувати, що твій досвід більше не рахується. Що пауза в кар'єрі стала тягарем, який треба пояснювати і виправдовувати. Що резюме йдуть у нікуди – а ти починаєш думати, що справа в тобі.<\u002Fp>\n          <p style=\"margin: 0;\">Я маю власну методику й успішні кейси трансформації. Найбільшим успіхом вважаю те, що люди, яким я допомогла знайти роботу, змінили своє життя. Робота стала для них не просто наступною кар'єрною сходинкою, а якісною зміною життя.<\u002Fp>\n          <p style=\"margin: 0;\">Це особливо важливо для жінок з великими перервами в кар'єрі, з якими я працюю. Для них вихід на роботу часто – початок шляху віри в себе.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size: clamp(20px, 2.2vw, 26px); font-style: italic; line-height: 1.35; margin: 24px 0 0; border-left: 2px solid var(--color-accent); padding-left: 20px; color: var(--color-bg);\">Кар'єра після 35 – це не пізно. Це досвід, який нарешті працює на тебе.<\u002Fp>\n        <div style=\"margin-top: 28px;\">\n          <a class=\"btn btn-secondary\" href=\"https:\u002F\u002Ft.me\u002FIrenLutsenko\" target=\"_blank\" rel=\"noopener\" style=\"color: var(--color-bg); border-color: var(--color-bg);\">Написати Ірині<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"cases\" style=\"max-width: 1180px; margin: 0 auto; padding: 56px 24px;\">\n    <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px;\">Результат<\u002Fdiv>\n    <h2 style=\"font-family: var(--font-heading); font-size: clamp(30px, 3.6vw, 46px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 10px;\">Як це виглядає на практиці<\u002Fh2>\n    <p style=\"color: var(--color-neutral-800); margin: 0 0 32px;\">Приклади з індивідуальної кар'єрної роботи.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 2px; background: var(--color-text);\">\n\n      <div style=\"background: var(--color-bg); padding: 24px;\">\n        <div style=\"display: flex; gap: 16px; align-items: center; border-bottom: 2px solid var(--color-text); padding-bottom: 16px;\">\n          <div class=\"grayscale\" style=\"flex: none;\">\n            <img src=\"d579e69c-2cd6-45b4-bba0-3b296403055b\" alt=\"Оксана, 53\" style=\"width: 64px; height: 64px; object-fit: cover;\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;\">Кейс – Оксана, 53<\u002Fdiv>\n            <a href=\"https:\u002F\u002Fwww.instagram.com\u002Fp\u002FDa254e6gvk-\u002F?img_index=1&amp;igsh=bnVpOTNjbHZ0a3hu\" target=\"_blank\" rel=\"noopener\" style=\"font-weight: 700; font-size: 15px;\">Кейс в Instagram →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 16px 0; border-bottom: 1px solid var(--color-neutral-300);\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 6px;\">Точка А<\u002Fdiv>\n          <p style=\"margin: 0; color: var(--color-neutral-800);\">20 років у різних ролях – школа, репетиторство, бізнес-клуб, музей. На співбесідах відчувала, що її бачать виконавицею, хоча всередині давно доросла до керівної ролі. Боялась, що «для такої посади я вже застара».<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 16px 0;\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 6px;\">Точка Б<\u002Fdiv>\n          <p style=\"margin: 0; color: var(--color-neutral-800);\">Розібрали, як розповідати про цей досвід так, щоб він читався як перевага, а не розкид. Вийшла з чіткою історією про себе і планом, куди рухатись.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-style: italic; border-top: 1px solid var(--color-neutral-300); padding-top: 14px;\">Іноді тебе не бачать не тому, що нема чого показати – а тому, що ти сама ще не наважилась це сказати вголос.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background: var(--color-bg); padding: 24px;\">\n        <div style=\"display: flex; gap: 16px; align-items: center; border-bottom: 2px solid var(--color-text); padding-bottom: 16px;\">\n          <div class=\"grayscale\" style=\"flex: none;\">\n            <img src=\"8d94c5f9-be76-49e1-99e9-8dfa26756afd\" alt=\"Ліля, 45\" style=\"width: 64px; height: 64px; object-fit: cover;\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;\">Кейс – Ліля, 45<\u002Fdiv>\n            <a href=\"https:\u002F\u002Fwww.instagram.com\u002Fp\u002FDaKph4kAkUM\u002F?igsh=MTJhdWszZmU5Zjdueg==\" target=\"_blank\" rel=\"noopener\" style=\"font-weight: 700; font-size: 15px;\">Кейс в Instagram →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 16px 0; border-bottom: 1px solid var(--color-neutral-300);\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 6px;\">Точка А<\u002Fdiv>\n          <p style=\"margin: 0; color: var(--color-neutral-800);\">У 45 відчувала, що загубила себе – не розуміла, як пояснити свій шлях новому роботодавцю і чи є ще сенс щось починати.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 16px 0;\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 6px;\">Точка Б<\u002Fdiv>\n          <p style=\"margin: 0; color: var(--color-neutral-800);\">Розібрали сильні сторони, що виснажує і який напрямок дійсно підходить. З'явилось чітке розуміння себе – і слова, якими про це розказати.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-style: italic; border-top: 1px solid var(--color-neutral-300); padding-top: 14px;\">Іноді достатньо однієї розмови, щоб подивитись на власний досвід зовсім по-іншому – навіть у 45.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background: var(--color-bg); padding: 24px;\">\n        <div style=\"display: flex; gap: 16px; align-items: center; border-bottom: 2px solid var(--color-text); padding-bottom: 16px;\">\n          <div class=\"grayscale\" style=\"flex: none;\">\n            <img src=\"fcfa7148-0092-47de-a3c6-9336d7de0f2d\" alt=\"Оксана, 43\" style=\"width: 64px; height: 64px; object-fit: cover;\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;\">Кейс – Оксана, 43<\u002Fdiv>\n            <a href=\"https:\u002F\u002Fwww.instagram.com\u002Fp\u002FDbauY5sggte\u002F?img_index=1&amp;igsh=bGk0YzRuZHc0eWY0\" target=\"_blank\" rel=\"noopener\" style=\"font-weight: 700; font-size: 15px;\">Кейс в Instagram →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 16px 0; border-bottom: 1px solid var(--color-neutral-300);\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 6px;\">Точка А<\u002Fdiv>\n          <p style=\"margin: 0; color: var(--color-neutral-800);\">Мрія була, а рішучості заявити про себе публічно – ще ні. Знайоме відчуття для жінок 35+, які роками ставили себе на другий план заради сім'ї чи стабільної роботи.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 16px 0;\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 6px;\">Точка Б<\u002Fdiv>\n          <p style=\"margin: 0; color: var(--color-neutral-800);\">Розклали два шляхи поруч: як заявити про себе вже зараз і як паралельно рухати власну справу. Вийшла з конкретним планом дій.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-style: italic; border-top: 1px solid var(--color-neutral-300); padding-top: 14px;\">Коли здається, що ще не час себе показувати – часто справа не в часі. Бракує тільки першого кроку.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background: var(--color-bg); padding: 24px;\">\n        <div style=\"display: flex; gap: 16px; align-items: center; border-bottom: 2px solid var(--color-text); padding-bottom: 16px;\">\n          <div class=\"grayscale\" style=\"flex: none;\">\n            <img src=\"50fb705e-03af-49b2-9438-8131cfd3d3c2\" alt=\"Таня, 41\" style=\"width: 64px; height: 64px; object-fit: cover;\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;\">Кейс – Таня, 41<\u002Fdiv>\n            <a href=\"https:\u002F\u002Fwww.instagram.com\u002Fp\u002FDah6yv4gsJk\u002F?igsh=NDk3cWJyNXczOW16\" target=\"_blank\" rel=\"noopener\" style=\"font-weight: 700; font-size: 15px;\">Кейс в Instagram →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 16px 0; border-bottom: 1px solid var(--color-neutral-300);\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 6px;\">Точка А<\u002Fdiv>\n          <p style=\"margin: 0; color: var(--color-neutral-800);\">Розривалась між кількома напрямками одразу – і не могла зібрати досвід в один зрозумілий наратив для резюме чи LinkedIn.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 16px 0;\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 6px;\">Точка Б<\u002Fdiv>\n          <p style=\"margin: 0; color: var(--color-neutral-800);\">Не звужували її до чогось одного – розклали два реальні шляхи поруч і подивились, який насправді ближчий. Вийшла з конкретним планом.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-style: italic; border-top: 1px solid var(--color-neutral-300); padding-top: 14px;\">Коли важко розказати про себе одним реченням, часто це не брак досвіду. Просто бракує структури.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <div style=\"margin-top: 32px;\">\n      <a class=\"btn btn-primary\" href=\"{{ payLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ onPayClick }}\">Оплатити участь – {{ priceLabel }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"hr\" style=\"max-width: 1180px; margin: 0 auto;\">\n\n  <section id=\"faq\" style=\"max-width: 1180px; margin: 0 auto; padding: 56px 24px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 40px; align-items: start;\">\n      <div>\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px;\">Питання<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-heading); font-size: clamp(30px, 3.6vw, 46px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0;\">Питання, які часто запитують<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text);\">\n        <details style=\"border-bottom: 2px solid var(--color-neutral-300); padding: 18px 0;\">\n          <summary style=\"cursor: pointer; font-weight: 800; font-size: 19px; list-style: none;\">Скільки часу потрібно приділяти програмі?<\u002Fsummary>\n          <p style=\"color: var(--color-neutral-800); margin: 12px 0 0;\">15–30 хвилин на день – цього достатньо. Завдання короткі та одразу практичні. Якщо пропустиш день – матеріали нікуди не зникнуть, зможеш повернутися до них у зручний час.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-bottom: 2px solid var(--color-neutral-300); padding: 18px 0;\">\n          <summary style=\"cursor: pointer; font-weight: 800; font-size: 19px; list-style: none;\">Я не вмію користуватися LinkedIn. Це проблема?<\u002Fsummary>\n          <p style=\"color: var(--color-neutral-800); margin: 12px 0 0;\">Ні. Ми або створимо профіль з нуля, або доопрацюємо той, що вже є. Я покажу, що саме потрібно змінити, щоб профіль працював на тебе.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-bottom: 2px solid var(--color-neutral-300); padding: 18px 0;\">\n          <summary style=\"cursor: pointer; font-weight: 800; font-size: 19px; list-style: none;\">Чи будеш ти відповідати мені особисто?<\u002Fsummary>\n          <p style=\"color: var(--color-neutral-800); margin: 12px 0 0;\">Так. Я щодня в чаті: відповідаю на запитання, коментую завдання та допомагаю розібрати складні моменти. Це жива група з підтримкою, а не автоматичний курс.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-bottom: 2px solid var(--color-neutral-300); padding: 18px 0;\">\n          <summary style=\"cursor: pointer; font-weight: 800; font-size: 19px; list-style: none;\">А якщо я живу не в Україні?<\u002Fsummary>\n          <p style=\"color: var(--color-neutral-800); margin: 12px 0 0;\">Усе відбувається онлайн у Telegram. Завдання виходять вранці за київським часом, а виконувати їх можна тоді, коли тобі зручно. Тож твій часовий пояс не має значення.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-bottom: 2px solid var(--color-neutral-300); padding: 18px 0;\">\n          <summary style=\"cursor: pointer; font-weight: 800; font-size: 19px; list-style: none;\">Чи підійде програма, якщо я хочу не нову роботу, а підвищення?<\u002Fsummary>\n          <p style=\"color: var(--color-neutral-800); margin: 12px 0 0;\">Так. Уміння правильно презентувати свій досвід, говорити про свої сильні сторони та впевнено відповідати на запитання потрібне і під час пошуку нової роботи, і для кар'єрного зростання на теперішньому місці.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-bottom: 2px solid var(--color-text); padding: 18px 0;\">\n          <summary style=\"cursor: pointer; font-weight: 800; font-size: 19px; list-style: none;\">А якщо після програми я не отримаю офер?<\u002Fsummary>\n          <p style=\"color: var(--color-neutral-800); margin: 12px 0 0;\">Офер залежить від ринку, конкретної вакансії, роботодавця та багатьох факторів, які ми не можемо контролювати. Але за 21 день ти підготуєш те, на що можеш реально впливати: чітку стратегію пошуку роботи, сильне резюме та LinkedIn, професійну самопрезентацію і готові відповіді на складні запитання співбесіди.<\u002Fp>\n        <\u002Fdetails>\n        <div style=\"margin-top: 28px; border: 2px solid var(--color-text); padding: 22px;\">\n          <h3 style=\"font-family: var(--font-heading); font-size: 22px; font-weight: 800; margin: 0 0 8px;\">Не впевнена, чи підійде саме тобі?<\u002Fh3>\n          <p style=\"color: var(--color-neutral-800); margin: 0 0 16px;\">Напиши мені кілька слів про свою ситуацію. Я подивлюся і чесно скажу, чи підходить тобі цей формат.<\u002Fp>\n          <a class=\"btn btn-secondary\" href=\"https:\u002F\u002Ft.me\u002FIrenLutsenko?text=Хочу%20запитати%20про%20програму%20%C2%ABВидима%20і%20впевнена%C2%BB\" target=\"_blank\" rel=\"noopener\">Написати мені →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"finalcta\" style=\"background: var(--color-bg); border-top: 2px solid var(--color-text);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 72px 24px;\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 18px;\">Готова зробити перший крок?<\u002Fdiv>\n      <h2 style=\"font-family: var(--font-heading); font-size: clamp(40px, 6.5vw, 88px); font-weight: 800; line-height: 0.96; letter-spacing: -0.035em; margin: 0 0 28px; max-width: 18em;\">21 день. Старт 1 жовтня.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 32px; border-top: 2px solid var(--color-neutral-300); padding-top: 24px; align-items: start;\">\n        <p style=\"margin: 0; font-size: 18px;\">Живі зустрічі, конкретна стратегія пошуку роботи на 6 місяців і група, яка йде поруч – замість чергової поради «просто повір у себе».<\u002Fp>\n        <div>\n          <a class=\"btn btn-primary\" href=\"{{ payLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ onPayClick }}\">Оплатити участь – {{ priceLabel }}<\u002Fa>\n          <div style=\"font-size: 15px; margin-top: 14px;\">{{ finalMicro }}<\u002Fdiv>\n          <div style=\"font-size: 15px; margin-top: 6px;\">Є питання? Напиши мені в <a href=\"https:\u002F\u002Ft.me\u002FIrenLutsenko\" target=\"_blank\" rel=\"noopener\" style=\"color: var(--color-accent-700); text-decoration: underline;\">Telegram<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"legal\" style=\"max-width: 1180px; margin: 0 auto; padding: 56px 24px 0;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 32px; font-size: 15px; color: var(--color-neutral-800);\">\n      <div id=\"terms\">\n        <h3 style=\"font-family: var(--font-heading); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text); margin: 0 0 12px;\">Умови надання послуг<\u002Fh3>\n        <p style=\"margin: 0 0 10px;\">Продавець: ФОП Луценко Ірина Вікторівна. Послуга: участь в авторській програмі «Видима і впевнена» для жінок 35+.<\u002Fp>\n        <p style=\"margin: 0 0 10px;\">Формат: щоденні завдання в закритій групі Telegram + живі онлайн-зустрічі за розкладом. Доступ до групи й матеріалів надається протягом 24 годин після підтвердження оплати.<\u002Fp>\n        <p style=\"margin: 0;\">Тривалість: 21 день з дати старту потоку. Старт – 1 жовтня 2026. Ціна: €39 (early bird, до 30 вересня 2026 включно), з 1 жовтня 2026 – €79. Оплата карткою через WayForPay.<\u002Fp>\n      <\u002Fdiv>\n      <div id=\"refund\">\n        <h3 style=\"font-family: var(--font-heading); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text); margin: 0 0 12px;\">Політика повернення коштів<\u002Fh3>\n        <p style=\"margin: 0 0 10px;\">Якщо ви оплатили участь, але передумали до дати старту потоку – повне повернення за запитом на irenlutsen@gmail.com або в Telegram, протягом 5 робочих днів.<\u002Fp>\n        <p style=\"margin: 0 0 10px;\"><b style=\"font-weight: 800; color: var(--color-text);\">Гарантія перших 3 днів.<\u002Fb> Після старту у вас є ще 3 дні, щоб оцінити формат. Якщо програма не підходить – повідомте, і кошти повернуться в повному обсязі.<\u002Fp>\n        <p style=\"margin: 0;\">Після завершення цих 3 днів кошти не повертаються, оскільки послугу надано в повному обсязі доступу. У виняткових випадках питання розглядається індивідуально.<\u002Fp>\n      <\u002Fdiv>\n      <div id=\"contacts\">\n        <h3 style=\"font-family: var(--font-heading); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text); margin: 0 0 12px;\">Контактна інформація<\u002Fh3>\n        <p style=\"margin: 0;\">ФОП Луценко Ірина Вікторівна<br>ІПН: 2955000505<br>Україна, 08603, Київська обл., Обухівський р-н, м. Васильків, вул. Декабристів, 40\u002F1, кв. 10<br>Телефон: +38 (068) 352-11-51<br>Email: irenlutsen@gmail.com<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1180px; margin: 0 auto; padding: 40px 24px 0;\">\n    <div style=\"border-top: 2px solid var(--color-text); padding-top: 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;\">\n      <p style=\"margin: 0; color: var(--color-neutral-800);\">Є питання перед оплатою? Пишіть – і слідкуйте за оновленнями:<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n        <a class=\"btn btn-primary\" href=\"https:\u002F\u002Ft.me\u002FIrenLutsenko\" target=\"_blank\" rel=\"noopener\">Telegram<\u002Fa>\n        <a class=\"btn btn-secondary\" href=\"https:\u002F\u002Fwww.instagram.com\u002Fcareer.iren\" target=\"_blank\" rel=\"noopener\">Instagram<\u002Fa>\n        <a class=\"btn btn-secondary\" href=\"https:\u002F\u002Fwww.facebook.com\u002Fshare\u002F1DNtgundJ4\u002F?mibextid=wwXIfr\" target=\"_blank\" rel=\"noopener\">Facebook<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width: 1180px; margin: 0 auto; padding: 40px 24px 56px; font-size: 14px; color: var(--color-neutral-700);\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 10px;\">\n      <a href=\"#terms\">Умови надання послуг<\u002Fa>\n      <a href=\"#refund\">Повернення коштів<\u002Fa>\n      <a href=\"#contacts\">Контакти<\u002Fa>\n    <\u002Fdiv>\n    © 2026 Ірина Луценко – «Видима і впевнена». Авторська програма для жінок 35+.\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst PAYMENT_LINK = \"https:\u002F\u002Fsecure.wayforpay.com\u002Fbutton\u002Fb0ddbb734d42c\";\nconst PRICE_DEADLINE = new Date('2026-10-01T00:00:00+03:00');\nconst PROGRAM_START = new Date('2026-10-01T00:00:00+03:00');\nconst EARLY_PRICE = 39;\nconst REGULAR_PRICE = 79;\n\nfunction plural(n, one, few, many) {\n  const m10 = n % 10, m100 = n % 100;\n  if (m10 === 1 && m100 !== 11) return one;\n  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;\n  return many;\n}\n\nfunction countdownParts(diff) {\n  const days = Math.floor(diff \u002F 86400000);\n  const hours = Math.floor((diff % 86400000) \u002F 3600000);\n  const mins = Math.floor((diff % 3600000) \u002F 60000);\n  if (days > 0) return days + \" \" + plural(days, \"день\", \"дні\", \"днів\") + \" \" + hours + \" год\";\n  if (hours > 0) return hours + \" год \" + mins + \" хв\";\n  return mins + \" хв\";\n}\n\nclass Component extends DCLogic {\n  state = { now: new Date() };\n\n  componentDidMount() {\n    this.timer = setInterval(() => this.setState({ now: new Date() }), 60000);\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n  }\n\n  renderVals() {\n    const now = this.state.now;\n    const early = now < PRICE_DEADLINE;\n    const price = early ? EARLY_PRICE : REGULAR_PRICE;\n    const started = now >= PROGRAM_START;\n\n    let badgeLine1, badgeLine2;\n    if (early) {\n      badgeLine1 = \"€\" + EARLY_PRICE + \" до 30.09\";\n      badgeLine2 = \"залишилось \" + countdownParts(PRICE_DEADLINE - now);\n    } else if (!started) {\n      badgeLine1 = \"€\" + REGULAR_PRICE;\n      badgeLine2 = \"старт через \" + countdownParts(PROGRAM_START - now);\n    } else {\n      badgeLine1 = \"Програма вже стартувала\";\n      badgeLine2 = \"напишіть про наступний потік\";\n    }\n\n    return {\n      payLink: PAYMENT_LINK,\n      priceLabel: \"€\" + price,\n      priceTag: early ? \"Early bird · до 30 вересня\" : \"Ціна участі\",\n      badgeLine1,\n      badgeLine2,\n      finalMicro: early\n        ? \"€\" + EARLY_PRICE + \" до 30 вересня · далі €\" + REGULAR_PRICE + \" · оплата підтверджує місце\"\n        : \"€\" + REGULAR_PRICE + \" за участь · оплата підтверджує місце\",\n      onPayClick: () => {\n        if (typeof window.fbq === \"function\") {\n          window.fbq(\"track\", \"InitiateCheckout\", {\n            value: price,\n            currency: \"EUR\",\n            content_name: \"Видима і впевнена – авторська програма\"\n          });\n        }\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
