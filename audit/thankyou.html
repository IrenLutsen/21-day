:root{--ink:#111;--muted:#6E6E73;--blue:#1077FD;--blue-dark:#0A5FD6;--font:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}

ol li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:18px 0;border-top:1px solid #111}
ol li:last-child{border-bottom:1px solid #111}
ol li::before{content:counter(s);font-size:26px;line-height:1;color:var(--blue)}
ol b{display:block;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;text-decoration:none;font-weight:500;font-size:18px;letter-spacing:.05em;padding:15px 30px;border-radius:999px;margin-top:10px}
