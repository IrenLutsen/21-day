<title>Дякуємо за оплату — Видима і впевнена</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#1C1912;
    --ink-soft:#5A5348;
    --orange:#FF5B1F;
    --orange-deep:#E14700;
    --orange-pale:#FFF1E7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--orange-pale);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:24px;
  }
  .card{
    background:var(--paper);
    border-radius:24px;
    padding:56px 44px;
    max-width:560px;
    text-align:center;
    box-shadow:0 20px 50px -20px rgba(28,25,18,.25);
  }
  .check{
    width:72px;height:72px;border-radius:50%;
    background:var(--orange);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;
  }
  .check svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:3;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(26px,4vw,34px);
    margin:0 0 16px;
    line-height:1.2;
  }
  p{
    color:var(--ink-soft);
    font-size:17px;
    line-height:1.6;
    margin:0 0 12px;
  }
  .highlight{color:var(--orange-deep);font-weight:700;}
  .telegram-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:24px;
    padding:14px 28px;
    border-radius:100px;
    background:var(--orange);
    color:#fff;
    font-weight:700;
    text-decoration:none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="check">
    <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <h1>Дякуємо! Оплату отримано</h1>
  <p>Вітаємо в челенджі <span class="highlight">«Видима і впевнена»</span>. Ми надішлемо деталі доступу до групи протягом 24 годин на email або Telegram, вказаний під час оплати.</p>
  <p>Старт — 1 жовтня. До зустрічі!</p>
  <a class="telegram-btn" href="https://t.me/IrenLutsenko" target="_blank">Написати в Telegram →</a>
</div>
